name: Build Piano RPM Packages

on:
  workflow_dispatch:
  push:
    paths:
      - "piano-*/**"
      - "gunyahvm-*/**"
      - "iio-sensor-proxy-ssc/**"
      - "xiaomi-piano-firmware/**"
      - "gunyahvm/**"
      - "casilda/**"
      - "qualcomm-iris-vaapi/**"
      - "qcom-npu/**"
      - ".github/workflows/build-piano-rpms.yml"

permissions:
  contents: read

env:
  APT_REPO_URL: https://github.com/yzddmr6/xiaomipad-8pro-mainline/releases/download/apt
  APT_INRELEASE_SHA256: 9de176c4aefb3c536cb0dc67f45bb8d84f8ff8af418363897d2223995fae5653
  APT_PACKAGES_SHA256: a5bae3d33f82b83eb24af4483d29aee317757c3932cd3e383a77a03fe6e2c7f3
  APT_KEYRING_URL: https://raw.githubusercontent.com/yzddmr6/xiaomipad-8pro-mainline/aa4095a02c8455dfabc3dc42a8bacdb11bacab6b/packaging/piano-archive-keyring/usr/share/keyrings/piano-archive-keyring.gpg
  APT_KEYRING_SHA256: d93e9b82ac560fb4ae7d64286e1f5ca70da754f0e5cab275398a34aba683e4b9
  GUNYAHVM_SOURCE_URL: https://github.com/yzddmr6/GunyahVM/releases/download/v1.5.1/gunyahvm-1.5.1-source.tar.zst
  GUNYAHVM_SOURCE_SHA256: dfba234792a68b574b45ba9a0bb7240aa2ecd5391fda5f9cd943da9d9c9914df
  GUNYAHVM_LIBJPEG_TURBO8_URL: https://ports.ubuntu.com/ubuntu-ports/pool/main/libj/libjpeg-turbo/libjpeg-turbo8_2.1.5-4ubuntu4_arm64.deb
  GUNYAHVM_LIBJPEG_TURBO8_SHA256: cd6cac6155d81d8d2e4a53693a7c91b42b26d1e84d018792d319c24cddaaf9d8
  CASILDA_SOURCE_URL: https://archive.ubuntu.com/ubuntu/pool/universe/c/casilda/casilda_1.4.0.orig.tar.xz
  CASILDA_SOURCE_SHA256: 63d85aa795f27ee5e5404ec7d8f6d955874f131bbff6ff9e6efe904d415a362c
  HEXAGONRPC_SOURCE_URL: https://github.com/linux-msm/hexagonrpc/archive/598b591ae9da6a6cfe2ca5ea78998019ca6395ea.tar.gz
  HEXAGONRPC_SOURCE_SHA256: 05181d130f1e3a3f4c368be606a627562f7abd972c5efff92a21d66d35a2fe51
  QUALCOMM_IRIS_SOURCE_URL: https://codeload.github.com/phxinyang/qualcomm-iris-vaapi/tar.gz/4125b1190c66ff7cf46e54c2b6d4076a01d7d1cd
  QUALCOMM_IRIS_SOURCE_SHA256: 71b127e72f17a3056749de13fa68158a9f1d506f986d571f214312b5ee41b104
  CROSVM_SOURCE_URL: https://codeload.github.com/google/crosvm/tar.gz/96e84c3f680e34e82e932ef911ae97d734121758
  CROSVM_SOURCE_SHA256: 805f9e718ae1256193a65549281b52cfd44999d3ebe54204f1c75c91fd5249c3
  MINIJAIL_SOURCE_URL: https://codeload.github.com/google/minijail/tar.gz/7845d89927a82dbdcdee6276837cd0978f69ba19
  MINIJAIL_SOURCE_SHA256: f9b1844f624a298d62ce5cabe8b95d9b582c175f92da9352041db48af83a6ea4
  CROSVM_CARGO_LOCK_PRE_PATCH_SHA256: 297fcbd82506ed0dcee1140cd91036ccba4fce9ca34052cbf36b1d80cba3d384
  CROSVM_CARGO_LOCK_SHA256: 3dd3103d84d1eaf303918b05317fcc19feb6a90f265e3591297f2ce151d1425b
  AOSP_MKBOOTIMG_REPO_URL: https://android.googlesource.com/platform/system/tools/mkbootimg
  AOSP_MKBOOTIMG_COMMIT: 4a27dd13adf9846e12d585d6fe99a375ebb58396
  AOSP_MKBOOTIMG_SHA256: 37d84b3d162e0bc62e36c1f4e1c63c85ea0caa9f29be023eb2f8efe006ad948c
  AOSP_UNPACK_BOOTIMG_SHA256: 06b54dd9a07c5281778e29e234e76f6e3faee8bf0c904a5ef88fdee30eeed12e
  IIO_SENSOR_PROXY_SOURCE_URL: https://deb.debian.org/debian/pool/main/i/iio-sensor-proxy/iio-sensor-proxy_3.9.orig.tar.bz2
  IIO_SENSOR_PROXY_SOURCE_SHA256: 19a4ae99b1b8af603fc789841025f9747bf445418d69ec7389e75adb6c8186bf
  UPSTREAM_TAG: v1.6.3
  UPSTREAM_COMMIT: b43fc2b0c6402574ce7fc6ec064275165f7f5699

jobs:
  build:
    name: Build RPMs (Fedora latest aarch64)
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:latest
      options: --user 0
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          set -euxo pipefail
          dnf install -y \
            cargo ccache cpio curl dpkg dnf-plugins-core git gnupg2-verify gzip patch patchelf \
            rpm-build rpmdevtools rust \
            sccache systemd-rpm-macros tar unzip
          dnf install -y --nogpgcheck \
            --repofrompath 'terra,https://repos.fyralabs.com/terra$releasever' \
            terra-release
          rpmdev-setuptree
          mkdir -p "$HOME/rpmbuild/tmp"
          mkdir -p "$HOME/.cache/ccache" "$HOME/.cache/sccache"

      - name: Restore C/C++ compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: piano-rpm-ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build-piano-rpms.yml', '**/*.spec', '**/*.patch') }}
          restore-keys: |
            piano-rpm-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Rust compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: piano-rpm-sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build-piano-rpms.yml', '**/*.spec', '**/*.patch') }}
          restore-keys: |
            piano-rpm-sccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure compiler caches
        run: |
          set -euxo pipefail
          ccache --max-size=2G
          ccache --set-config=compression=true
          sccache --start-server
          {
            echo "PATH=/usr/lib64/ccache:$PATH"
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_BASEDIR=$HOME/rpmbuild"
            echo "CCACHE_NOHASHDIR=true"
            echo "SCCACHE_DIR=$HOME/.cache/sccache"
            echo "SCCACHE_CACHE_SIZE=2G"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"

      - name: Stage upstream source
        run: |
          set -euxo pipefail
          source_tree="$RUNNER_TEMP/piano-mainline-source"
          git clone --depth 1 --branch "$UPSTREAM_TAG" \
            https://github.com/yzddmr6/xiaomipad-8pro-mainline "$source_tree"
          test "$(git -C "$source_tree" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          git -C "$source_tree" archive --format=tar.gz \
            --prefix=piano-source/ --output "$HOME/rpmbuild/SOURCES/piano-source-$UPSTREAM_TAG.tar.gz" \
            "$UPSTREAM_TAG" device/boot device/camera device/sensors device/virtualization \
            packaging/piano-camerad packaging/piano-device-support \
            packaging/piano-iio-sensor-proxy packaging/piano-sensors \
            packaging/piano-crosvm packaging/piano-vm \
            firmware/README.md firmware/sensors tools/piano-camera-test.py \
            tools/crosvm.lock.json docs/VIRTUALIZATION.md \
            docs/VIRTUALIZATION.zh-CN.md \
            tools/build-persistent-boot.py tools/initramfs_archive.py \
            LICENSE NOTICE LICENSES
          "$source_tree/tools/fetch-aosp-avb.sh"
          aosp_tree="$RUNNER_TEMP/aosp-mkbootimg"
          git clone --quiet --filter=blob:none --no-checkout \
            "$AOSP_MKBOOTIMG_REPO_URL" "$aosp_tree"
          git -C "$aosp_tree" fetch --quiet --depth 1 origin "$AOSP_MKBOOTIMG_COMMIT"
          git -C "$aosp_tree" checkout --quiet --detach "$AOSP_MKBOOTIMG_COMMIT"
          echo "$AOSP_MKBOOTIMG_SHA256  $aosp_tree/mkbootimg.py" | sha256sum -c -
          echo "$AOSP_UNPACK_BOOTIMG_SHA256  $aosp_tree/unpack_bootimg.py" | sha256sum -c -
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf "$HOME/rpmbuild/SOURCES/aosp-mkbootimg.tar.gz" \
            -C "$aosp_tree" mkbootimg.py unpack_bootimg.py gki/generate_gki_certificate.py
          install -m0755 "$source_tree/tools/local/aosp-avb/avbtool.py" \
            "$HOME/rpmbuild/SOURCES/avbtool.py"

      - name: Stage crosvm source and vendor crates
        run: |
          set -euxo pipefail
          crosvm_work="$RUNNER_TEMP/crosvm-work"
          crosvm_src="$crosvm_work/src"
          vendor_root="$crosvm_work/vendor-root"
          mkdir -p "$crosvm_src" "$vendor_root"
          curl --fail --location --retry 3 \
            --output "$crosvm_work/crosvm-96e84c3.tar.gz" \
            "$CROSVM_SOURCE_URL"
          curl --fail --location --retry 3 \
            --output "$crosvm_work/minijail-7845d899.tar.gz" \
            "$MINIJAIL_SOURCE_URL"
          echo "$CROSVM_SOURCE_SHA256  $crosvm_work/crosvm-96e84c3.tar.gz" |
            sha256sum -c -
          echo "$MINIJAIL_SOURCE_SHA256  $crosvm_work/minijail-7845d899.tar.gz" |
            sha256sum -c -
          tar -xzf "$crosvm_work/crosvm-96e84c3.tar.gz" \
            --strip-components=1 -C "$crosvm_src"
          echo "$CROSVM_CARGO_LOCK_PRE_PATCH_SHA256  $crosvm_src/Cargo.lock" |
            sha256sum -c -
          git init -q "$crosvm_src"
          for patchfile in "$GITHUB_WORKSPACE"/piano-vm/patches/*.patch; do
            git -C "$crosvm_src" apply "$patchfile"
          done
          mkdir -p "$crosvm_src/third_party/minijail"
          tar -xzf "$crosvm_work/minijail-7845d899.tar.gz" \
            --strip-components=1 -C "$crosvm_src/third_party/minijail"
          cargo vendor --locked --versioned-dirs \
            --manifest-path "$crosvm_src/Cargo.toml" \
            "$vendor_root/cargo-vendor"
          echo "$CROSVM_CARGO_LOCK_SHA256  $crosvm_src/Cargo.lock" |
            sha256sum -c -
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --transform='s,^Cargo.lock$,crosvm-Cargo.lock,' \
            -czf "$HOME/rpmbuild/SOURCES/crosvm-vendor.tar.gz" \
            -C "$vendor_root" cargo-vendor -C "$crosvm_src" Cargo.lock
          install -m0644 "$crosvm_work/crosvm-96e84c3.tar.gz" \
            "$HOME/rpmbuild/SOURCES/"
          install -m0644 "$crosvm_work/minijail-7845d899.tar.gz" \
            "$HOME/rpmbuild/SOURCES/"

      - name: Stage iio-sensor-proxy upstream source
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            --output "$HOME/rpmbuild/SOURCES/iio-sensor-proxy-3.9.tar.bz2" \
            "$IIO_SENSOR_PROXY_SOURCE_URL"
          echo "$IIO_SENSOR_PROXY_SOURCE_SHA256  $HOME/rpmbuild/SOURCES/iio-sensor-proxy-3.9.tar.bz2" |
            sha256sum -c -

      - name: Download and stage Debian RPM sources
        run: |
          set -euxo pipefail
          apt_root="$GITHUB_WORKSPACE/build-work/apt"
          deb_root="$apt_root/debs"
          mkdir -p "$deb_root"
          curl --fail --location --retry 3 \
            --output "$apt_root/InRelease" "$APT_REPO_URL/InRelease"
          curl --fail --location --retry 3 \
            --output "$apt_root/Packages" "$APT_REPO_URL/Packages"
          curl --fail --location --retry 3 \
            --output "$apt_root/piano-archive-keyring.gpg" "$APT_KEYRING_URL"
          echo "$APT_INRELEASE_SHA256  $apt_root/InRelease" | sha256sum -c -
          echo "$APT_PACKAGES_SHA256  $apt_root/Packages" | sha256sum -c -
          echo "$APT_KEYRING_SHA256  $apt_root/piano-archive-keyring.gpg" | sha256sum -c -
          gpgv --keyring "$apt_root/piano-archive-keyring.gpg" "$apt_root/InRelease"
          python3 - "$apt_root/InRelease" "$apt_root/Packages" "$APT_PACKAGES_SHA256" <<'PY'
          import hashlib, re, sys

          inrelease = open(sys.argv[1], "rb").read().decode()
          packages = open(sys.argv[2], "rb").read()
          expected = sys.argv[3]
          match = re.search(r"^\s*([0-9a-f]{64})\s+(\d+)\s+Packages\s*$", inrelease, re.M)
          if not match or match.group(1) != expected:
              raise SystemExit("Packages SHA256 is not covered by the signed InRelease")
          if int(match.group(2)) != len(packages) or hashlib.sha256(packages).hexdigest() != expected:
              raise SystemExit("Packages size or SHA256 does not match InRelease")
          PY
          python3 - "$apt_root/Packages" "$deb_root" "$HOME/rpmbuild/SOURCES" "$APT_REPO_URL" <<'PY'
          import hashlib, os, shutil, subprocess, sys

          index_path, destination, source_dir, base_url = sys.argv[1:]
          wanted = {
              "piano-device-support": "piano-device-support.deb",
              "piano-local-firmware": "xiaomi-piano-firmware.deb",
              "piano-vm-windows": "piano-vm-windows.deb",
              "gunyahvm": "gunyahvm.deb",
          }
          records = {}
          for stanza in open(index_path).read().strip().split("\n\n"):
              fields = {}
              for line in stanza.splitlines():
                  if line and not line[0].isspace() and ": " in line:
                      key, value = line.split(": ", 1)
                      fields[key] = value
              name = fields.get("Package")
              if name in wanted and fields.get("Architecture") in {"arm64", "all"}:
                  if name in records:
                      raise SystemExit(f"duplicate APT entry for {name}")
                  records[name] = fields
          if set(records) != set(wanted):
              raise SystemExit(f"APT package set mismatch; missing {sorted(set(wanted) - set(records))}")
          for name in sorted(wanted):
              entry = records[name]
              filename = entry["Filename"].removeprefix("./")
              output = os.path.join(destination, os.path.basename(filename))
              url = f"{base_url.rstrip('/')}/{filename}"
              subprocess.run(["curl", "--fail", "--location", "--retry", "3", "--output", output, url], check=True)
              digest = hashlib.sha256()
              with open(output, "rb") as deb:
                  for block in iter(lambda: deb.read(1024 * 1024), b""):
                      digest.update(block)
              if digest.hexdigest() != entry["SHA256"]:
                  raise SystemExit(f"SHA256 mismatch for {name} {entry['Version']}")
              source_name = wanted[name]
              shutil.copyfile(output, os.path.join(source_dir, source_name))
              print(f"Verified {name} {entry['Version']} ({entry['Architecture']}) -> {source_name}")
          PY
          curl --fail --location --retry 3 \
            --output "$HOME/rpmbuild/SOURCES/gunyahvm-1.5.1-source.tar.zst" \
            "$GUNYAHVM_SOURCE_URL"
          echo "$GUNYAHVM_SOURCE_SHA256  $HOME/rpmbuild/SOURCES/gunyahvm-1.5.1-source.tar.zst" |
            sha256sum -c -
          curl --fail --location --retry 3 \
            --output "$HOME/rpmbuild/SOURCES/libjpeg-turbo8_2.1.5-4ubuntu4_arm64.deb" \
            "$GUNYAHVM_LIBJPEG_TURBO8_URL"
          echo "$GUNYAHVM_LIBJPEG_TURBO8_SHA256  $HOME/rpmbuild/SOURCES/libjpeg-turbo8_2.1.5-4ubuntu4_arm64.deb" |
            sha256sum -c -
          curl --fail --location --retry 3 \
            --output "$HOME/rpmbuild/SOURCES/casilda-1.4.0.tar.xz" \
            "$CASILDA_SOURCE_URL"
          echo "$CASILDA_SOURCE_SHA256  $HOME/rpmbuild/SOURCES/casilda-1.4.0.tar.xz" |
            sha256sum -c -
          curl --fail --location --retry 3 \
            --output "$HOME/rpmbuild/SOURCES/hexagonrpc-598b591a.tar.gz" \
            "$HEXAGONRPC_SOURCE_URL"
          echo "$HEXAGONRPC_SOURCE_SHA256  $HOME/rpmbuild/SOURCES/hexagonrpc-598b591a.tar.gz" |
            sha256sum -c -
          curl --fail --location --retry 3 \
            --output "$HOME/rpmbuild/SOURCES/qualcomm-iris-vaapi-4125b119.tar.gz" \
            "$QUALCOMM_IRIS_SOURCE_URL"
          echo "$QUALCOMM_IRIS_SOURCE_SHA256  $HOME/rpmbuild/SOURCES/qualcomm-iris-vaapi-4125b119.tar.gz" |
            sha256sum -c -
          rm -rf "$GITHUB_WORKSPACE/build-work"

          install -m0644 piano-sensors/iio-sensor-proxy.service.d/piano.conf \
            "$HOME/rpmbuild/SOURCES/piano-sensors-iio-sensor-proxy.conf"
          install -m0755 piano-switch-slot/zz-piano-boot \
            "$HOME/rpmbuild/SOURCES/zz-piano-boot"
          install -m0755 piano-switch-slot/zz-piano-boot-postrm \
            "$HOME/rpmbuild/SOURCES/zz-piano-boot-postrm"
          install -m0755 piano-switch-slot/piano-local-update \
            "$HOME/rpmbuild/SOURCES/piano-local-update"
          install -m0755 piano-switch-slot/sta \
            "$HOME/rpmbuild/SOURCES/sta"
          install -m0644 piano-switch-slot/piano-switch-to-android.desktop \
            "$HOME/rpmbuild/SOURCES/piano-switch-to-android.desktop"
          install -m0644 piano-switch-boot/fedora-boot-compat.patch \
            "$HOME/rpmbuild/SOURCES/fedora-boot-compat.patch"
          install -m0644 gunyahvm/runtime.json \
            "$HOME/rpmbuild/SOURCES/runtime.json"
          install -m0644 gunyahvm/gunyahvm-runtime-fragments.patch \
            "$HOME/rpmbuild/SOURCES/gunyahvm-runtime-fragments.patch"
          install -m0644 gunyahvm-guest-linux/runtime.json \
            "$HOME/rpmbuild/SOURCES/gunyahvm-guest-linux-runtime.json"
          install -m0644 gunyahvm-macos/runtime.json \
            "$HOME/rpmbuild/SOURCES/gunyahvm-macos-runtime.json"
          install -m0644 gunyahvm-windows/runtime.json \
            "$HOME/rpmbuild/SOURCES/gunyahvm-windows-runtime.json"
          install -m0644 casilda/0001-forward-touch-to-wayland-clients.patch \
            "$HOME/rpmbuild/SOURCES/0001-forward-touch-to-wayland-clients.patch"
          install -m0644 casilda/0002-initialize-and-propagate-output-scale.patch \
            "$HOME/rpmbuild/SOURCES/0002-initialize-and-propagate-output-scale.patch"
          install -m0644 iio-sensor-proxy-ssc/patches/*.patch \
            "$HOME/rpmbuild/SOURCES/"
          install -m0644 piano-sensors/patches/*.patch \
            "$HOME/rpmbuild/SOURCES/"
          install -m0644 piano-camerad/*.patch \
            "$HOME/rpmbuild/SOURCES/"
          install -m0644 qualcomm-iris-vaapi/000*.patch \
            "$HOME/rpmbuild/SOURCES/"
          for patchfile in piano-vm/patches/*.patch; do
            install -m0644 "$patchfile" \
              "$HOME/rpmbuild/SOURCES/piano-vm-${patchfile##*/}"
          done
          install -m0644 piano-device-support/audio/Xiaomi-Pad-8-Pro.conf \
            "$HOME/rpmbuild/SOURCES/Xiaomi-Pad-8-Pro.conf"
          install -m0644 piano-device-support/audio/Xiaomi-Pad-8-Pro-HiFi.conf \
            "$HOME/rpmbuild/SOURCES/Xiaomi-Pad-8-Pro-HiFi.conf"
          install -m0644 piano-device-support/audio/Piano-Capture-Diag.conf \
            "$HOME/rpmbuild/SOURCES/Piano-Capture-Diag.conf"
          install -m0644 piano-device-support/audio/Piano-Capture-Diag-HiFi.conf \
            "$HOME/rpmbuild/SOURCES/Piano-Capture-Diag-HiFi.conf"
          install -m0644 piano-device-support/audio/50-piano-speaker-upmix.conf \
            "$HOME/rpmbuild/SOURCES/50-piano-speaker-upmix.conf"
          install -m0644 piano-device-support/build-touch.py \
            "$HOME/rpmbuild/SOURCES/build-touch.py"
          install -m0644 piano-device-support/pen-button-compat.patch \
            "$HOME/rpmbuild/SOURCES/pen-button-compat.patch"
          install -m0644 piano-device-support/pen-m80p-position-gap.patch \
            "$HOME/rpmbuild/SOURCES/pen-m80p-position-gap.patch"
          install -m0644 piano-device-support/pen-docked-bond-recovery.patch \
            "$HOME/rpmbuild/SOURCES/pen-docked-bond-recovery.patch"
          install -m0644 piano-device-support/audio/speaker-rotation/* "$HOME/rpmbuild/SOURCES/"
          install -m0644 piano-device-support/power/*.conf "$HOME/rpmbuild/SOURCES/"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf "$HOME/rpmbuild/SOURCES/piano-touch-source.tar" \
            -C piano-device-support/touch-source .
      - name: Install RPM build dependencies
        run: |
          set -euxo pipefail
          for spec in \
            xiaomi-piano-firmware/xiaomi-piano-firmware.spec \
            qualcomm-iris-vaapi/qualcomm-iris-vaapi.spec \
            iio-sensor-proxy-ssc/iio-sensor-proxy-ssc.spec \
            piano-sensors/piano-sensors.spec \
            piano-camerad/piano-camerad.spec \
            piano-device-support/piano-device-support.spec \
            piano-switch-slot/piano-switch-slot.spec \
            piano-switch-boot/piano-switch-boot.spec \
            gunyahvm/gunyahvm.spec \
            gunyahvm-guest-linux/gunyahvm-guest-linux.spec \
            gunyahvm-macos/gunyahvm-macos.spec \
            gunyahvm-windows/gunyahvm-windows.spec \
            casilda/casilda.spec \
            piano-vm/piano-vm.spec; do
            dnf builddep -y "$spec"
          done

      - name: Build RPMs
        run: |
          set -euxo pipefail
          for spec in \
            xiaomi-piano-firmware/xiaomi-piano-firmware.spec \
            qualcomm-iris-vaapi/qualcomm-iris-vaapi.spec \
            iio-sensor-proxy-ssc/iio-sensor-proxy-ssc.spec \
            piano-sensors/piano-sensors.spec \
            piano-camerad/piano-camerad.spec \
            piano-device-support/piano-device-support.spec \
            piano-switch-slot/piano-switch-slot.spec \
            piano-switch-boot/piano-switch-boot.spec \
            gunyahvm/gunyahvm.spec \
            gunyahvm-guest-linux/gunyahvm-guest-linux.spec \
            gunyahvm-macos/gunyahvm-macos.spec \
            gunyahvm-windows/gunyahvm-windows.spec \
            casilda/casilda.spec \
            piano-vm/piano-vm.spec; do
            TMPDIR="$HOME/rpmbuild/tmp" rpmbuild -ba --nodebuginfo \
              --define "_topdir $HOME/rpmbuild" "$spec"
          done

      - name: Show compiler cache statistics
        if: always()
        run: |
          ccache --show-stats || true
          sccache --show-stats || true

      - name: Show package results
        run: |
          set -euxo pipefail
          find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" \
            -type f -printf '%p %s bytes\n' | sort

      - name: Upload RPMs
        uses: actions/upload-artifact@v7
        with:
          name: piano-rpms
          path: ~/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Upload SRPMs
        uses: actions/upload-artifact@v7
        with:
          name: piano-srpms
          path: ~/rpmbuild/SRPMS/**/*.src.rpm
          if-no-files-found: error
          retention-days: 14

  build-qcom-npu:
    name: Build QCOM NPU RPMs from source (Fedora x86_64)
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
      options: --user 0
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          set -euxo pipefail
          dnf install -y \
            ccache cpio curl dpkg dnf-plugins-core git gzip patch \
            rpm-build rpmdevtools systemd-rpm-macros tar unzip
          rpmdev-setuptree
          mkdir -p "$HOME/rpmbuild/tmp"
          mkdir -p "$HOME/.cache/ccache" "$HOME/npu-inputs"

      - name: Restore QCOM NPU source inputs
        uses: actions/cache@v4
        with:
          path: ~/npu-inputs
          key: qcom-npu-inputs-${{ env.UPSTREAM_COMMIT }}

      - name: Restore QCOM NPU C/C++ compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: qcom-npu-ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qcom-npu/qcom-npu.spec', 'qcom-npu/stage-sources.py') }}
          restore-keys: |
            qcom-npu-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure QCOM NPU cross compiler cache
        run: |
          set -euxo pipefail
          ccache --max-size=2G
          ccache --set-config=compression=true
          mkdir -p "$RUNNER_TEMP/ccache-bin"
          for compiler in gcc g++; do
            wrapper="$RUNNER_TEMP/ccache-bin/aarch64-linux-gnu-$compiler"
            printf '%s\n' '#!/bin/sh' \
              "exec ccache /usr/bin/aarch64-linux-gnu-$compiler \"\$@\"" > "$wrapper"
            chmod 0755 "$wrapper"
          done
          {
            echo "PATH=$RUNNER_TEMP/ccache-bin:/usr/lib64/ccache:$PATH"
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_BASEDIR=$HOME/rpmbuild"
            echo "CCACHE_NOHASHDIR=true"
          } >> "$GITHUB_ENV"

      - name: Stage Fedora aarch64 sysroot
        run: |
          set -euxo pipefail
          sysroot="$RUNNER_TEMP/fedora-aarch64-sysroot"
          sysroot_rpms="$RUNNER_TEMP/fedora-aarch64-sysroot-rpms"
          target_release="$(rpm -E %fedora)"
          mkdir -p "$sysroot" "$sysroot_rpms"
          dnf download \
            --releasever="$target_release" \
            --forcearch=aarch64 \
            --destdir="$sysroot_rpms" \
            filesystem glibc glibc-common glibc-devel kernel-headers libatomic libgcc \
            libstdc++ libstdc++-devel libxcrypt libxcrypt-devel
          for rpmfile in "$sysroot_rpms"/*.rpm; do
            rpm2cpio "$rpmfile" | cpio -idm --quiet -D "$sysroot"
          done
          test -L "$sysroot/lib64"
          ln -sfn libatomic.so.1 "$sysroot/usr/lib64/libatomic.so"
          ln -s libgcc_s.so.1 "$sysroot/usr/lib64/libgcc_s.so"
          ln -s libstdc++.so.6 "$sysroot/usr/lib64/libstdc++.so"
          for libdir in "$sysroot/usr/lib64" "$sysroot/usr/lib/aarch64-linux-gnu"; do
            mkdir -p "$libdir"
            if [ "$libdir" = "$sysroot/usr/lib/aarch64-linux-gnu" ]; then
              ln -sfn ../../lib64/libatomic.so.1 "$libdir/libatomic.so"
            fi
            cat > "$libdir/libatomic_asneeded.so" <<'EOF'
          /* GNU ld script
             Add DT_NEEDED entry for -latomic only if needed. */
          INPUT ( AS_NEEDED ( -latomic ) )
          EOF
          done
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf "$HOME/rpmbuild/SOURCES/fedora-aarch64-sysroot.tar.gz" \
            -C "$sysroot" .

      - name: Stage upstream source
        run: |
          set -euxo pipefail
          source_tree="$RUNNER_TEMP/piano-mainline-source"
          git clone --depth 1 --branch "$UPSTREAM_TAG" \
            https://github.com/yzddmr6/xiaomipad-8pro-mainline "$source_tree"
          test "$(git -C "$source_tree" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          git -C "$source_tree" archive --format=tar.gz \
            --prefix=piano-source/ \
            --output "$HOME/rpmbuild/SOURCES/piano-source-$UPSTREAM_TAG.tar.gz" \
            "$UPSTREAM_TAG" packaging/npu firmware/npu tools/build-npu.py \
            LICENSE NOTICE LICENSES
          python3 qcom-npu/stage-sources.py \
            --lock "$source_tree/packaging/npu/sources.json" \
            --output "$HOME/npu-inputs"
          install -m0644 "$HOME/npu-inputs/"* "$HOME/rpmbuild/SOURCES/"
          install -m0644 qcom-npu/build-npu-fedora-sysroot.patch \
            "$HOME/rpmbuild/SOURCES/"

      - name: Build RPMs
        run: |
          set -euxo pipefail
          dnf builddep -y qcom-npu/qcom-npu.spec
          rpmspec -P qcom-npu/qcom-npu.spec >/dev/null
          if ! TMPDIR="$HOME/rpmbuild/tmp" rpmbuild -ba --nodebuginfo \
            --target aarch64 --define "_topdir $HOME/rpmbuild" \
            qcom-npu/qcom-npu.spec; then
            find "$HOME/rpmbuild/BUILD" \
              -path '*/source/fastrpc/*/config.log' -type f \
              -exec sh -c 'echo "--- FastRPC compiler probe: $1 ---"; grep -n -B 6 -A 25 -E "checking whether the C compiler works|cannot find|undefined reference|collect2|fatal error|error:|ld:" "$1" | tail -n 240 || true' _ {} \;
            exit 1
          fi
          find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" \
            -type f -printf '%p %s bytes\n' | sort

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Upload RPMs
        uses: actions/upload-artifact@v7
        with:
          name: qcom-npu-rpms
          path: ~/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs:
      - build
      - build-qcom-npu
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get short commit SHA
        run: echo "SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Download RPMs
        uses: actions/download-artifact@v8
        with:
          name: piano-rpms
          path: rpms/aarch64

      - name: Download QCOM NPU RPMs
        uses: actions/download-artifact@v8
        with:
          name: qcom-npu-rpms
          path: rpms/qcom-npu

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: piano-${{ env.SHORT_SHA }}
          name: Piano Packages (${{ env.SHORT_SHA }})
          files: rpms/**/*.rpm
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
